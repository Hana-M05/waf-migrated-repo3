#################################################################
# WAF Security Configuration
# 
# This file controls what gets blocked and what security 
# protections are enabled for your website/application.
#
# ACTIONS EXPLAINED:
# - "block": Completely blocks the request (recommended for production)
# - "count": Logs the request but allows it through (good for testing)
# - "allow": Explicitly allows the request (rarely used)
#################################################################

#################################################################
# General Configurations
# 
# A set of general configurations for the WAF, including
# the ALB name, environment, and region.
#################################################################
alb_arns: []
api_gateway_ids: []
global: false
redacted_headers: 
  - "test-junk"
  - "test-junk2"
region: "us-east-1"
waf_error_subscribers:
  - "sam.mcmanus@siemens.com"

#################################################################
# SECURITY PROTECTION RULES
# 
# Configure different types of automated security protections.
# Each rule can be enabled/disabled and set to block, count, or allow.
#################################################################
protection_rules:
  #################################################################
  # IP BLOCKING
  # 
  # Block specific IP addresses from accessing your website.
  # Add IP addresses in CIDR format (use /32 for single IPs).
  #################################################################
  ip_blocking:
    enabled: true
    action: "block"
    ips:
      - "185.177.72.3/32"
      - "146.148.91.67/32"
      - "44.218.174.94/32"
      - "178.18.252.24/32"
      - "123.20.29.193/32"
      - "150.129.80.32/32"
      - "209.58.168.85/32"
      - "107.175.244.0/24"
      - "184.168.104.171/32"
      - "66.19.230.146/32"
      - "52.114.128.147/32"
      - "115.132.182.208/32"
      - "107.175.199.0/24"
      - "34.41.10.143/32"
      - "34.28.197.214/32"
      - "134.29.246.229/32"

  #################################################################
  # GEOLOCATION BLOCKING
  #
  # In block mode, creates a blacklist of countries
  # In allow mode, creates a whitelist of countries
  #################################################################
  geolocation_blocking:
    enabled: true
    action: "allow"
    countries: 
      - "AS"
      - "AU"
      - "BD"
      - "BM"
      - "BN"
      - "CA"
      - "CN"
      - "CU"
      - "CZ"
      - "DO"
      - "EG"
      - "FR"
      - "DE"
      - "GR"
      - "GU"
      - "IN"
      - "IT"
      - "JP"
      - "JO"
      - "MY"
      - "MX"
      - "NZ"
      - "PA"

  #################################################################
  # CUSTOM PATH BLOCKING
  # 
  # Block access to specific parts of your website like admin
  # areas, internal APIs, or sensitive endpoints.
  #################################################################
  path_blocking:
    enabled: true
    action: "block"
    paths:
      - "/StrongholdDM/api/login"

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  rate_limiting:
    enabled: true
    rules: [
      {
        name: "citizenportal-rate-limit",
        action: "block",
        limit: 10, # Minimum 10 requests
        aggregate_key_type: "IP",
        evaluation_window_sec: 60,
        uri_path: {
          positional_constraint: "ENDS_WITH",
          search_string: "/workrequest"
        },
        method: "POST",
        header: {
          name: "host",
          positional_constraint: "STARTS_WITH",
          search_string: "citizenportal"
        }
      },
      {
        name: 'test-junk',
        action: "count",
        limit: 20,
        aggregate_key_type: "IP",
        evaluation_window_sec: 60,
        uri_path: {
          positional_constraint: "STARTS_WITH",
          search_string: "junk"
        },
        header: {
          name: "host",
          positional_constraint: "CONTAINS",
          search_string: "citizenportal"
        }
      },
    ]

  #################################################################
  # CAPTCHA PROTECTION
  # 
  # Challenge suspicious requests with a CAPTCHA to verify
  # they are from humans. Customize rules as needed.
  #################################################################
  captcha: 
    enabled: true
    rules: [
      {
        name: "citizenportal-captcha",
        uri_path: {
          positional_constraint: "ENDS_WITH",
          search_string: "/home"
        },
        header: {
          name: "host",
          positional_constraint: "STARTS_WITH",
          search_string: "citizenportal"
        }
      }
    ]

  #################################################################
  # BLOCK UNAUTHORIZED SCANNERS
  # 
  # Blocks requests from known vulnerability scanners that are
  # not used by Brightly.
  #################################################################
  block_unauthorized_scanners:
    enabled: true
    action: "block"

  #################################################################
  # AWS MANAGED SECURITY RULES
  # 
  # These are pre-built security rules provided by AWS that
  # protect against common attacks and threats.
  #################################################################
  basic_protection:
    enabled: true
    action: "block"

  malicious_requests:
    enabled: true
    action: "block"

  sql_injection:
    enabled: true
    action: "block"

  windows_protection:
    enabled: true
    action: "block"

  linux_protection:
    enabled: false
    action: "block"

  ip_reputation:
    enabled: true
    action: "block"

#################################################################
# DISABLE SPECIFIC SECURITY RULES
# 
# If legitimate traffic is being blocked by AWS managed rules,
# you can disable specific rules here. Only do this if you 
# understand the security implications.
# 
# Note: This only applies to AWS managed rules, not custom
# IP or path blocking rules.
#################################################################
disabled_rules:
  basic_protection:
    - "NoUserAgent_HEADER"
    - "SizeRestrictions_BODY"
    - "UserAgent_BadBots_HEADER"
  malicious_requests:
    - "Log4JRCE_BODY"
  sql_injection:
    - "SQLi_BODY"
  windows_protection:
    - "WindowsShellCommands_BODY"
  ip_reputation: 
    - "AWSManagedReconnaissanceList"
  linux_protection: [] 