#################################################################
# WAF Security Configuration
# 
# This file controls what gets blocked and what security 
# protections are enabled for your website/application.
#
# ACTIONS EXPLAINED:
# - "block": Completely blocks the request (recommended for production)
# - "count": Logs the request but allows it through (good for testing)
# - "allow": Explicitly allows the request (rarely used)
#################################################################

#################################################################
# General Configurations
# 
# A set of general configurations for the WAF, including
# the ALB name, environment, and region.
#################################################################
alb_arns: [
  "arn:aws:elasticloadbalancing:us-east-1:750920731536:loadbalancer/app/apalb-ue1-master-primary/35510aa8b975e987", 
  "arn:aws:elasticloadbalancing:us-east-1:750920731536:loadbalancer/app/acapialb-ue1-master-primary/f64ee08fd697ffbc", 
  "arn:aws:elasticloadbalancing:us-east-1:750920731536:loadbalancer/app/dtalb-ue1-master-primary/9e85bb14e0f985d8",
  "arn:aws:elasticloadbalancing:us-east-1:750920731536:loadbalancer/app/zionweb-master-alb/2d9351eb3e29e977"
]
api_gateway_ids: []
global: false
region: "us-east-1"
waf_error_subscribers:
  - "sam.mcmanus@siemens.com"
  
#################################################################
# SECURITY PROTECTION RULES
# 
# Configure different types of automated security protections.
# Each rule can be enabled/disabled and set to block, count, or allow.
#################################################################
protection_rules:
  #################################################################
  # IP BLOCKING
  # 
  # Block specific IP addresses from accessing your website.
  # Add IP addresses in CIDR format (use /32 for single IPs).
  #################################################################
  ip_blocking:
    enabled: true
    action: "block"
    ips:
      - "185.177.72.3/32"
      - "146.148.91.67/32"
      - "44.218.174.94/32"
      - "178.18.252.24/32"
      - "123.20.29.193/32"
      - "150.129.80.32/32"
      - "209.58.168.85/32"
      - "107.175.244.0/24"
      - "184.168.104.171/32"
      - "66.19.230.146/32"
      - "52.114.128.147/32"
      - "115.132.182.208/32"
      - "107.175.199.0/24"
      - "34.41.10.143/32"
      - "34.28.197.214/32"
      - "134.29.246.229/32"
  #################################################################
  # CUSTOM PATH BLOCKING
  # 
  # Block access to specific parts of your website like admin
  # areas, internal APIs, or sensitive endpoints.
  #################################################################
  path_blocking:
    enabled: true
    action: "block"
    paths:
      - "/StrongholdDM/api/login"

  #################################################################
  # GEOLOCATION BLOCKING
  #
  # In block mode, creates a blacklist of countries
  # In allow mode, creates a whitelist of countries
  #################################################################
  geolocation_blocking:
    enabled: false
    action: "block"
    countries: []

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  rate_limiting:
    enabled: false
    rules: []

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  captcha:
    enabled: false
    rules: []

  #################################################################
  # BLOCK UNAUTHORIZED SCANNERS
  # 
  # Blocks requests from known vulnerability scanners that are
  # not used by Brightly.
  # Currently the only scanners identified are Tenable's.
  #################################################################
  block_unauthorized_scanners:
    enabled: true
    action: "count"

  #################################################################
  # AWS MANAGED SECURITY RULES
  # 
  # These are pre-built security rules provided by AWS that
  # protect against common attacks and threats.
  #################################################################
  basic_protection:
    enabled: true
    action: "block"

  malicious_requests:
    enabled: true
    action: "block"
    
  sql_injection:
    enabled: true
    action: "block" 

  windows_protection:
    enabled: true
    action: "block"

  linux_protection:
    enabled: false
    action: "block"

  ip_reputation:
    enabled: false

#################################################################
# DISABLE SPECIFIC SECURITY RULES
# 
# If legitimate traffic is being blocked by AWS managed rules,
# you can disable specific rules here. Only do this if you 
# understand the security implications.
# 
# Note: This only applies to AWS managed rules, not custom
# IP or path blocking rules.
#################################################################
disabled_rules:
  basic_protection: 
    - "SizeRestrictions_BODY" # Triggered in genuine usage across a variety of endpoints
    - "NoUserAgent_HEADER" # Triggered during API requests, possibly due to our web server config
    - "CrossSiteScripting_BODY" # Triggered during `/wotaskbulk` usage, because customers can specify CSS
    - "GenericRFI_BODY" # Triggered when making genuine work order requests
    - "GenericLFI_BODY" # Triggered during file upload through the API
    - "SizeRestrictions_QUERYSTRING" # Triggered in genuine API queries
  malicious_requests: 
    - "JavaDeserializationRCE_BODY" # Triggered during some API calls. Very infrequent, but we don't use Java anyways.
  sql_injection: 
    - "SQLi_BODY" # Triggered when customers ty to upload files
    - "SQLi_QUERYARGUMENTS" # Triggered when trying to filter work orders and users through the API
    - "SQLi_COOKIE" # Unclear why this is being triggered, but observed in logs across a variety of customers/IPs
  windows_protection: 
    - "WindowsShellCommands_BODY" # Genuine cusotmer activity across a variety of tenants and endpoints
  linux_protection: [] 