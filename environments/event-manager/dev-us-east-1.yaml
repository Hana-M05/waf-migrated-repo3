#################################################################
# WAF Security Configuration
# 
# This file controls what gets blocked and what security 
# protections are enabled for your website/application.
#
# ACTIONS EXPLAINED:
# - "block": Completely blocks the request (recommended for production)
# - "count": Logs the request but allows it through (good for testing)
# - "allow": Explicitly allows the request (rarely used)
#################################################################

#################################################################
# General Configurations
# 
# A set of general configurations for the WAF, including
# the ALB name, environment, and region.
#################################################################
alb_arns: [
  "arn:aws:elasticloadbalancing:us-east-1:993748385324:loadbalancer/app/management-orange-alb/63e64edaf482845c",
  "arn:aws:elasticloadbalancing:us-east-1:993748385324:loadbalancer/app/api-orange-alb/c1ece0d701b1ab42",
  "arn:aws:elasticloadbalancing:us-east-1:993748385324:loadbalancer/app/api2-orange-alb/01b17825d6b8599b",
  "arn:aws:elasticloadbalancing:us-east-1:993748385324:loadbalancer/app/ui-orange-alb/c1ae26430ee2b6dc",
  "arn:aws:elasticloadbalancing:us-east-1:993748385324:loadbalancer/app/surveysweb-orange-alb/1db3b59900eb8ac6"
]
api_gateway_ids: []
global: false
redacted_headers: 
  - "eventstoken"
region: "us-east-1"
waf_error_subscribers:
  - "sam.mcmanus@siemens.com"

#################################################################
# SECURITY PROTECTION RULES
# 
# Configure different types of automated security protections.
# Each rule can be enabled/disabled and set to block, count, or allow.
#################################################################
protection_rules:
  #################################################################
  # IP BLOCKING
  # 
  # Block specific IP addresses from accessing your website.
  # Add IP addresses in CIDR format (use /32 for single IPs).
  #################################################################
  ip_blocking:
    enabled: false
    ips: []
  #################################################################
  # CUSTOM PATH BLOCKING
  # 
  # Block access to specific parts of your website like admin
  # areas, internal APIs, or sensitive endpoints.
  #################################################################
  path_blocking:
    enabled: false
    paths: []

  #################################################################
  # GEOLOCATION BLOCKING
  #
  # In block mode, creates a blacklist of countries
  # In allow mode, creates a whitelist of countries
  #################################################################
  geolocation_blocking:
    enabled: false
    action: "count"
    countries: []

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  rate_limiting:
    enabled: false
    rules: []

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  captcha:
    enabled: false
    rules: []

  #################################################################
  # BLOCK UNAUTHORIZED SCANNERS
  # 
  # Blocks requests from known vulnerability scanners that are
  # not used by Brightly.
  #################################################################
  block_unauthorized_scanners:
    enabled: true
    action: "count"

  #################################################################
  # AWS MANAGED SECURITY RULES
  # 
  # These are pre-built security rules provided by AWS that
  # protect against common attacks and threats.
  #################################################################
  basic_protection:
    enabled: true
    action: "count"

  malicious_requests:
    enabled: true
    action: "count"
    
  sql_injection:
    enabled: true
    action: "count"

  windows_protection:
    enabled: true
    action: "count"

  linux_protection:
    enabled: false
    action: "count"
  
  ip_reputation:
    enabled: true
    action: "count"

#################################################################
# DISABLE SPECIFIC SECURITY RULES
# 
# If legitimate traffic is being blocked by AWS managed rules,
# you can disable specific rules here. Only do this if you 
# understand the security implications.
# 
# Note: This only applies to AWS managed rules, not custom
# IP or path blocking rules.
#################################################################
disabled_rules:
  basic_protection: 
    - "NoUserAgent_HEADER" # Triggered by a variety of API requests
    - "SizeRestrictions_BODY" # Triggered in large API requests 
    - "CrossSiteScripting_BODY" # Triggered by /api/package/invoice/apply
    - "SizeRestrictions_QUERYSTRING" # Triggered on reCAPTCHA
  malicious_requests: []
  sql_injection: 
    - "SQLi_QUERYARGUMENTS" # Triggered on query.ashx and /page/ical
    - "SQLi_BODY" # Triggered on `/api/products/template/search`
    # - "SQLi_COOKIE" # Triggered once by what appeared to be an apple bot?
  windows_protection: 
    - "WindowsShellCommands_QUERYARGUMENTS" # Some of our calendar event download paths trigger this
    # - "WindowsShellCommands_COOKIE" # Triggered once by a stonybrook customer
    - "PowerShellCommands_QUERYARGUMENTS" # Occasionally triggers on query.ashx for some events
  linux_protection: [] 
  ip_reputation: []