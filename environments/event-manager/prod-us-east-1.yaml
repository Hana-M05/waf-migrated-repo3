#################################################################
# WAF Security Configuration
# 
# This file controls what gets blocked and what security 
# protections are enabled for your website/application.
#
# ACTIONS EXPLAINED:
# - "block": Completely blocks the request (recommended for production)
# - "count": Logs the request but allows it through (good for testing)
# - "allow": Explicitly allows the request (rarely used)
#################################################################

#################################################################
# General Configurations
# 
# A set of general configurations for the WAF, including
# the ALB name, environment, and region.
#################################################################
alb_arns: [
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ui-staging-alb/7c7bc9831047d29b",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/api-staging-alb/1ccf813b7b9cde8f",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/api2-staging-alb/522c5811eb2fc073",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/surveysweb-staging-alb/ace453ea55c85861",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/pentestui-staging-alb2/572ca3b0071bd24f",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-demo-01/b6879aab6f85cf27",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-demo-02/9bad2634b914cc71",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-demo-03/b3bd8db08da5cd5a",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-demo-04/d42a55cfe1ce91dd",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-demo-05/66c2bb3cc5f3b73e",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-prod-01/a78b1b051a9eb117",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-prod-02/99d1afc50ffe3be4",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-prod-03/c51fb6988895912e",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-prod-04/447690893acd31d1",
  # "arn:aws:elasticloadbalancing:us-east-1:622913004475:loadbalancer/app/ALB-ue1-prod-05/42c08f63d8745b9b"
]
api_gateway_ids: []
global: false
region: "us-east-1"
#################################################################
# SECURITY PROTECTION RULES
# 
# Configure different types of automated security protections.
# Each rule can be enabled/disabled and set to block, count, or allow.
#################################################################
protection_rules:
  #################################################################
  # IP BLOCKING
  # 
  # Block specific IP addresses from accessing your website.
  # Add IP addresses in CIDR format (use /32 for single IPs).
  #################################################################
  ip_blocking:
    enabled: false
    ips: []
  #################################################################
  # CUSTOM PATH BLOCKING
  # 
  # Block access to specific parts of your website like admin
  # areas, internal APIs, or sensitive endpoints.
  #################################################################
  path_blocking:
    enabled: false
    paths: []

  #################################################################
  # GEOLOCATION BLOCKING
  #
  # In block mode, creates a blacklist of countries
  # In allow mode, creates a whitelist of countries
  #################################################################
  geolocation_blocking:
    enabled: false
    action: "count"
    countries: []

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  rate_limiting:
    enabled: false
    rules: []

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  captcha:
    enabled: false
    rules: []

  #################################################################
  # AWS MANAGED SECURITY RULES
  # 
  # These are pre-built security rules provided by AWS that
  # protect against common attacks and threats.
  #################################################################
  basic_protection:
    enabled: true
    action: "count"

  malicious_requests:
    enabled: true
    action: "count"
    
  sql_injection:
    enabled: true
    action: "count"

  windows_protection:
    enabled: true
    action: "count"

  linux_protection:
    enabled: false
    action: "count"

  block_unauthorized_scanners:
    enabled: true
    action: "count"

#################################################################
# DISABLE SPECIFIC SECURITY RULES
# 
# If legitimate traffic is being blocked by AWS managed rules,
# you can disable specific rules here. Only do this if you 
# understand the security implications.
# 
# Note: This only applies to AWS managed rules, not custom
# IP or path blocking rules.
#################################################################
disabled_rules:
  basic_protection: 
    - "NoUserAgent_HEADER" # Triggered during API requests, possibly due to our web server config
    - "CrossSiteScripting_BODY" # Triggered during confirmconnector.asmx queries and centralEnquiries"
    - "SizeRestrictions_BODY" # Triggered in genuine usage across a variety of endpoints
    - "SizeRestrictions_QUERYSTRING" # Triggered in genuine usage of GraphQL endpoints
    - "EC2MetaDataSSRF_BODY" # Triggered by the mobile app
    - "GenericLFI_BODY" # Triggered by the document upload endpoint
    - "SizeRestrictions_URIPATH" # Triggered through Confirm Connect endpoint
  malicious_requests: []
  sql_injection: 
    - "SQLi_QUERYARGUMENTS" # Triggered during GraphQL queries
    - "SQLi_BODY" # Triggered during document uploads
  windows_protection: 
    - "WindowsShellCommands_BODY" # Triggered during GraphQL queries and API queries
    - "WindowsShellCommands_QUERYARGUMENTS" # Triggered by some confirm api endpoints
  linux_protection: [] 