#################################################################
# WAF Security Configuration
# 
# This file controls what gets blocked and what security 
# protections are enabled for your website/application.
#
# ACTIONS EXPLAINED:
# - "block": Completely blocks the request (recommended for production)
# - "count": Logs the request but allows it through (good for testing)
# - "allow": Explicitly allows the request (rarely used)
#################################################################

#################################################################
# General Configurations
# 
# A set of general configurations for the WAF, including
# the ALB name, environment, and region.
#################################################################
alb_arns: [
  "arn:aws:elasticloadbalancing:us-east-1:910562428656:loadbalancer/app/api-sandbox-alb/2b8ea45b0a004656",
  "arn:aws:elasticloadbalancing:us-east-1:910562428656:loadbalancer/app/mothership-sandbox-alb/fbe9af65eb741748",
  "arn:aws:elasticloadbalancing:us-east-1:910562428656:loadbalancer/app/mainapp-pvm-sandbox-alb/9be03a7993da3b9a",
  "arn:aws:elasticloadbalancing:us-east-1:910562428656:loadbalancer/app/mainapp-slc-sandbox-alb/3160c6466ebabc66",
  "arn:aws:elasticloadbalancing:us-east-1:910562428656:loadbalancer/app/mainapp-seniorliving-sandbox-alb/d603b56b51795fb7",
  "arn:aws:elasticloadbalancing:us-east-1:910562428656:loadbalancer/app/mainapp-healthcare-sandbox-alb/332b472a7dbf46c1",
  "arn:aws:elasticloadbalancing:us-east-1:910562428656:loadbalancer/app/mainapp-cl-sandbox-alb/ad77ea2822f4c494",
] 
api_gateway_ids: []
global: false
redacted_headers: []
region: "us-east-1"
waf_error_subscribers:
  - "sam.mcmanus@siemens.com"
  
#################################################################
# SECURITY PROTECTION RULES
# 
# Configure different types of automated security protections.
# Each rule can be enabled/disabled and set to block, count, or allow.
#################################################################
protection_rules:
  #################################################################
  # IP BLOCKING
  # 
  # Block specific IP addresses from accessing your website.
  # Add IP addresses in CIDR format (use /32 for single IPs).
  #################################################################
  ip_blocking:
    enabled: false
    ips: []
  #################################################################
  # CUSTOM PATH BLOCKING
  # 
  # Block access to specific parts of your website like admin
  # areas, internal APIs, or sensitive endpoints.
  #################################################################
  path_blocking:
    enabled: false
    paths: []

  #################################################################
  # GEOLOCATION BLOCKING
  #
  # In block mode, creates a blacklist of countries
  # In allow mode, creates a whitelist of countries
  #################################################################
  geolocation_blocking:
    enabled: true
    action: "block"
    countries: [
      "RU"
    ]

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  rate_limiting:
    enabled: false
    rules: []

  #################################################################
  # CAPTCHA PROTECTION
  # 
  # Create CAPTCHA challenges in defined cases
  #################################################################
  captcha:
    enabled: false
    rules: []

  #################################################################
  # BLOCK UNAUTHORIZED SCANNERS
  # 
  # Blocks requests from known vulnerability scanners that are
  # not used by Brightly.
  #################################################################
  block_unauthorized_scanners:
    enabled: true
    action: "count"

  #################################################################
  # AWS MANAGED SECURITY RULES
  # 
  # These are pre-built security rules provided by AWS that
  # protect against common attacks and threats.
  #################################################################
  basic_protection:
    enabled: true
    action: "count"
    version: "Default"

  malicious_requests:
    enabled: true
    action: "count"
    version: "Default"
    
  sql_injection:
    enabled: true
    action: "count"
    version: "Default"

  windows_protection:
    enabled: true
    action: "count"
    version: "Default"

  linux_protection:
    enabled: false
    action: "count"
    version: "Default"

  ip_reputation:
    enabled: true
    action: "block"

#################################################################
# DISABLE SPECIFIC SECURITY RULES
# 
# If legitimate traffic is being blocked by AWS managed rules,
# you can disable specific rules here. Only do this if you 
# understand the security implications.
# 
# Note: This only applies to AWS managed rules, not custom
# IP or path blocking rules.
#################################################################
disabled_rules:
  basic_protection: 
    - "SizeRestrictions_BODY" # Triggered in large API requests  
    - "SizeRestrictions_QUERYSTRING" # Triggered by some of our calendar event download paths
    - "NoUserAgent_HEADER" # Some of our API requests don't include a user agent
    - "CrossSiteScripting_BODY" # Triggered in file uploads and mobile database updates
    - "GenericRFI_BODY" # Triggered on /UnitFile/WorkOrders/WorkOrderDetails and /UnitFile/WorkOrders/IsResidentAway
    - "GenericLFI_BODY" # Triggered on /UnitFile/WorkOrders/WorkOrderDetails and /UnitFile/WorkOrders/IsResidentAway
  malicious_requests: []
  sql_injection: 
    - "SQLi_COOKIE" # Triggered by mobile devices
    - "SQLi_BODY" # Triggered on a variety of POST requests by genuine validated customers
    - "SQLi_QUERYARGUMENTS" # Triggered primarily on encrypted query arguents
  windows_protection: 
    - "WindowsShellCommands_BODY" # Triggered on a variety of POST requests
    - "WindowsShellCommands_QUERYARGUMENTS" # Triggered on /Dashboard/Requestor/NotifyOthersByUnit when encrypted args are used
    - "PowerShellCommands_BODY" # Triggered very rarely on database update
  linux_protection: [] 
