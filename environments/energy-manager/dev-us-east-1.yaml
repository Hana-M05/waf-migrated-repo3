#################################################################
# WAF Security Configuration
# 
# This file controls what gets blocked and what security 
# protections are enabled for your website/application.
#
# ACTIONS EXPLAINED:
# - "block": Completely blocks the request (recommended for production)
# - "count": Logs the request but allows it through (good for testing)
# - "allow": Explicitly allows the request (rarely used)
#################################################################

#################################################################
# General Configurations
# 
# A set of general configurations for the WAF, including
# the ALB name, environment, and region.
#################################################################
alb_arns: [
  "arn:aws:elasticloadbalancing:us-east-1:059090138953:loadbalancer/app/ALB-ue1-orange-01/e7d7868733e0dde4"
]
api_gateway_ids: []
global: false
redacted_headers: []
region: "us-east-1"
waf_error_subscribers:
  - "sam.mcmanus@siemens.com"

#################################################################
# SECURITY PROTECTION RULES
# 
# Configure different types of automated security protections.
# Each rule can be enabled/disabled and set to block, count, or allow.
#################################################################
protection_rules:
  #################################################################
  # IP BLOCKING
  # 
  # Block specific IP addresses from accessing your website.
  # Add IP addresses in CIDR format (use /32 for single IPs).
  #################################################################
  ip_blocking:
    enabled: false
    ips: []
  #################################################################
  # CUSTOM PATH BLOCKING
  # 
  # Block access to specific parts of your website like admin
  # areas, internal APIs, or sensitive endpoints.
  #################################################################
  path_blocking:
    enabled: false
    paths: []

  #################################################################
  # GEOLOCATION BLOCKING
  #
  # In block mode, creates a blacklist of countries
  # In allow mode, creates a whitelist of countries
  #################################################################
  geolocation_blocking:
    enabled: false
    action: "count"
    countries: []

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  rate_limiting:
    enabled: false
    rules: []

  #################################################################
  # RATE LIMITING
  # 
  # Limit the number of requests from a single IP to prevent
  # abuse or DDoS attacks. Customize rules as needed.
  #################################################################
  captcha:
    enabled: false
    rules: []

  #################################################################
  # BLOCK UNAUTHORIZED SCANNERS
  # 
  # Blocks requests from known vulnerability scanners that are
  # not used by Brightly.
  #################################################################
  block_unauthorized_scanners:
    enabled: true
    action: "count"

  #################################################################
  # AWS MANAGED SECURITY RULES
  # 
  # These are pre-built security rules provided by AWS that
  # protect against common attacks and threats.
  #################################################################
  basic_protection:
    enabled: true
    action: "count"
    version: "Default"

  malicious_requests:
    enabled: true
    action: "count"
    version: "Default"
    
  sql_injection:
    enabled: true
    action: "count"
    version: "Default"

  windows_protection:
    enabled: true
    action: "count"
    version: "Default"

  linux_protection:
    enabled: false
    action: "count"
    version: "Default"
  
  ip_reputation:
    enabled: true
    action: "count"
    version: "Default"

#################################################################
# DISABLE SPECIFIC SECURITY RULES
# 
# If legitimate traffic is being blocked by AWS managed rules,
# you can disable specific rules here. Only do this if you 
# understand the security implications.
# 
# Note: This only applies to AWS managed rules, not custom
# IP or path blocking rules.
#################################################################
disabled_rules:
  basic_protection:
    - "SizeRestrictions_BODY" # Triggered when customers perform file uploads
    - "NoUserAgent_HEADER" # Triggered when customers use API testing tools like Postman or on internal traffic
    - "CrossSiteScripting_BODY" # Triggered when customers perform bills uploads or have form data with HTML-like content
    - "GenericLFI_BODY" # Triggered during file uploads or path-like strings in request bodies
    - "GenericRFI_BODY" # Triggered during file uploads or remote path-like strings in request bodies
    - "EC2MetaDataSSRF_BODY" # Triggered by metadata-like URL patterns in legitimate report or form body data
  malicious_requests: []
  sql_injection:
    - "SQLi_BODY" # Triggered on bill imports
  windows_protection: []
  linux_protection: []
  ip_reputation: []